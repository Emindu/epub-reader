[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
# HTTP for article import, news feeds and model downloads. Pure Rust (rustls),
# so it also works on iOS where there is no curl to shell out to.
ureq = { version = "2", features = ["gzip", "brotli"] }

# llama.cpp compiled into the app (Metal GPU). iOS can't spawn `llama-cli`, so
# it always gets this; on desktop it's opt-in (`--features embedded-llm`).
# Default features are off: no OpenMP (not in Apple clang), and no `common`
# (~14 MB of grammar helpers we don't use).
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false, features = ["metal"] }

[target.'cfg(target_os = "ios")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"] }
# AVAudioSession, so read-aloud keeps playing with the screen locked.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

# OS keychain for the "bring your own key" cloud AI feature. Other platforms
# fall back to a stub that reports "unsupported" (the app then keeps the key in
# localStorage).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[features]
embedded-llm = ["dep:llama-cpp-2"]

# tao 0.35.3 returns a freed UISceneConfiguration when the app uses UIScene
# (required by iOS 27), crashing at launch. Patched copy until upstream fixes it.
[patch.crates-io]
tao = { path = "vendor/tao" }
